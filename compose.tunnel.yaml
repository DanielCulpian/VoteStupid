# Activate explicitly with scripts/tunnel.ps1; local startup does not publish the app.
services:
  backend:
    environment:
      ADMIN_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${DOCKER_PUBLIC_ORIGIN:-https://unconfigured.invalid}

  frontend:
    networks:
      tunnel: {}

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://frontend:8080"]
    restart: "no"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      tunnel:
        ipv4_address: 172.30.79.20
      tunnel_egress: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s

networks:
  tunnel_egress: {}
  tunnel:
    internal: true
    ipam:
      config:
        - subnet: 172.30.79.0/24
