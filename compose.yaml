services:
  db:
    image: postgres:17
    container_name: votestupid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: votestupid
      POSTGRES_USER: votestupid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votestupid -d votestupid"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
