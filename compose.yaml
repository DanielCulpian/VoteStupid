services:
  db:
    image: postgres:17
    container_name: votestupid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: votestupid
      POSTGRES_USER: votestupid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votestupid -d votestupid"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configura la contrase?a administrativa}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${DOCKER_PUBLIC_ORIGIN:-http://localhost:8080}
      NGINX_INTERNAL_IP: ${NGINX_INTERNAL_IP:-172.30.78.10}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/polls?limit=1', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      internal:
        ipv4_address: ${NGINX_INTERNAL_IP:-172.30.78.10}
      edge: {}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${DOCKER_INTERNAL_SUBNET:-172.30.78.0/24}
  edge: {}

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-votestupid_postgres_data}
