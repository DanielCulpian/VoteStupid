map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Solo el conector dedicado puede afirmar que la conexión pública utiliza HTTPS.
map $realip_remote_addr $upstream_scheme {
    default $scheme;
    172.30.79.20 https;
}

# Redirige HTTP público; nunca confía en esta cabecera desde el acceso local.
map "$realip_remote_addr:$http_x_forwarded_proto" $tunnel_http_redirect {
    default 0;
    ~^172\.30\.79\.20:(?!https$) 1;
}

# Omite query, cookies y cabeceras privadas del registro.
log_format votestupid '$remote_addr $request_method $uri $status';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout votestupid;
    error_log /dev/stderr crit;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    # Esta IP pertenece exclusivamente a cloudflared en la red del túnel.
    set_real_ip_from 172.30.79.20;
    real_ip_header CF-Connecting-IP;
    if ($tunnel_http_redirect) { return 308 https://$host$request_uri; }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location /api/ {
        # Resolución dinámica: sigue funcionando si Compose sustituye el backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }
}
