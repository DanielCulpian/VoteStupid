map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Omite query, cookies y cabeceras privadas del registro.
log_format votestupid '$remote_addr $request_method $uri $status';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout votestupid;
    error_log /dev/stderr crit;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location /api/ {
        # Resolución dinámica: sigue funcionando si Compose sustituye el backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }
}
